name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run Test Suite
        env:
          PYTHONPATH: src
        run: |
          pytest --cov=cloud_forge --cov-report=term-missing tests/

      - name: Validate CLI Commands & Simulation
        run: |
          python -m cloud_forge.cli simulate --manifests ./test_manifests
          python -m cloud_forge.cli health
          python -m cloud_forge.cli security-audit
