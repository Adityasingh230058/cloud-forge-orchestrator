name: Bug Report
description: Create a report to help us improve Cloud Forge Orchestrator
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `cloud-forge deploy --spec custom_spec.yaml`
        2. Stage 3 fails with...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      placeholder: OS (Linux/Windows/macOS), Python version, Kubernetes version
    validations:
      required: false
